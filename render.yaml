services:
  - type: web
    name: oyun-uhaanii-academy-backend
    env: node
    plan: free
    buildCommand: cd back-end && npm run build:render && ./verify-deployment.sh
    startCommand: cd back-end && node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: PORT
        value: 10000
      - key: CORS_ORIGIN
        sync: false
