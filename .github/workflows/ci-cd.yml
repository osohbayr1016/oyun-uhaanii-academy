name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: |
          npm run install:all

      - name: Setup environment variables
        run: |
          echo "DATABASE_URL=postgresql://postgres:postgres@localhost:5432/test_db" >> back-end/.env
          echo "JWT_SECRET=test-secret-key" >> back-end/.env
          echo "NODE_ENV=test" >> back-end/.env
          echo "NEXT_PUBLIC_API_URL=http://localhost:5001" >> front-end/.env.local

      - name: Generate Prisma client
        run: |
          cd back-end
          npm run prisma:generate

      - name: Run database migrations
        run: |
          cd back-end
          npm run prisma:push

      - name: Run backend tests
        run: |
          cd back-end
          npm test

      - name: Run frontend tests
        run: |
          cd front-end
          npm test

      - name: Type checking
        run: |
          npm run type-check

      - name: Build applications
        run: |
          npm run build

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: |
          npm run install:all

      - name: Run linting
        run: |
          npm run lint

  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run security audit
        run: |
          npm audit --audit-level moderate
          cd back-end && npm audit --audit-level moderate
          cd ../front-end && npm audit --audit-level moderate

  deploy-staging:
    needs: [test, lint, security]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: |
          npm run install:all

      - name: Build applications
        run: |
          npm run build

      - name: Deploy to staging
        run: |
          echo "Deploying to staging environment..."
          # Add your staging deployment commands here
          # Example: Deploy to Vercel staging, Render staging, etc.

  deploy-production:
    needs: [test, lint, security]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: |
          npm run install:all

      - name: Build applications
        run: |
          npm run build

      - name: Deploy to production
        run: |
          echo "Deploying to production environment..."
          # Add your production deployment commands here
          # Example: Deploy to Vercel production, Render production, etc.

      - name: Run post-deployment tests
        run: |
          echo "Running post-deployment health checks..."
          # Add health check commands here
          # Example: curl your deployed endpoints to ensure they're working
